spring:
  application:
    name: goal
  config:
    import: jwtconfig-local.yaml

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:localmemdb;MODE=MySQL;
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      default_batch_fetch_size: 1000
    show-sql: true
    p6spy:
      enable-logging: true

logging:
  level:
    root: info

spring doc:
  use-fqn: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    with-credentials: true