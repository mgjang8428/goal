app:
  cookie:
    secure: false
  cors:
    allowed-origins: "http://example.com"
spring:
  application:
    name: goal
  config:
#    변경 필요!
    import: jwtconfig-example.yaml
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:localmemdb;MODE=MySQL;
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      default_batch_fetch_size: 1000
    show-sql: false
    p6spy:
      enable-logging: false
logging:
  level:
    root: info
    org:
      springframework: warn
spring doc:
  use-fqn: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    with-credentials: false